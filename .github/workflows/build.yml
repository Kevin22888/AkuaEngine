name: Linux Build with CUDA via Docker

on:
    push:
        branches: [ main, dev ]
    pull_request:
        branches: [ main, dev ]

jobs:
    build:
        runs-on: ubuntu-latest

        container:
            image: nvidia/cudagl:11.3.0-devel-ubuntu20.04
            options: --user root
        
        steps:
            - name: Install dependencies
              env:
                DEBIAN_FRONTEND: noninteractive
              run: |
                apt-get update
                apt-get install -y git build-essential libglfw3-dev libx11-dev \
                    libxi-dev libgl1-mesa-dev wget
                
                # Install newer CMake
                CMAKE_VERSION=3.27.9
                CMAKE_DIR=cmake-${CMAKE_VERSION}-linux-x86_64
                wget https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/${CMAKE_DIR}.sh
                chmod +x ${CMAKE_DIR}.sh
                ./${CMAKE_DIR}.sh --skip-license --prefix=/usr/local

            - name: Checkout repository
              uses: actions/checkout@v4
            
            - name: Configure and build project
              run: |
                cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
                cmake --build build --parallel
