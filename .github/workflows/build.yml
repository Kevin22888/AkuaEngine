name: Windows Build with CUDA

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit 12.9 via Winget
        run: |
          echo "Installing CUDA Toolkit 12.9..."
          winget install -e --id NVIDIA.CUDA.12.9

      - name: Add CUDA to PATH
        shell: powershell
        run: |
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9\bin"
          echo "##[add-path]$cudaPath"
          echo "Added CUDA path: $cudaPath"

      - name: Verify environment
        shell: powershell
        run: |
          echo "Checking CUDA installation..."
          & "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9\bin\nvcc.exe" --version
          cl

      - name: Configure and build with CMake
        shell: powershell
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release